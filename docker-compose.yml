name: pgdbserver

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /var/lib/pgdbserver/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${VPC_IP:-127.0.0.1}:5432:5432"
    networks:
      - infrastructure

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: >
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - /var/lib/pgdbserver/redis:/data
    ports:
      - "${VPC_IP:-127.0.0.1}:6379:6379"
    networks:
      - infrastructure

networks:
  infrastructure:
    name: pgdbserver_infrastructure
    driver: bridge

